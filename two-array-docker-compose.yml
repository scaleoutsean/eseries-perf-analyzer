# Reference example: monitoring two E-Series arrays with two collector instances.
#
# Run with:  sudo docker compose -f two-array-docker-compose.yml up -d
# (pass -f on every compose command, or the default docker-compose.yml is used instead)
#
# When copying a collector stanza to add a third array, each copy needs a unique:
#   - service name        (becomes the DNS name VictoriaMetrics scrapes)
#   - container_name
#   - Traefik router, middleware and service names, and a unique PathPrefix rule
# and the new target must be added to vm/prometheus-two-array.yml.

services:

  collector1:
    image: collector:${TAG}
    # image: ghcr.io/scaleoutsean/eseries-perf-analyzer/collector:4.0.0 # example of using GHCR image instead of building locally
    container_name: collector1
    build: ./epa/
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: 10m
    environment: 
      - USERNAME=admin
      - PASSWORD=infiniti  # non-production pass, thank you very much
      - API=192.168.1.194
      - API_PORT=8443
      - DEBUG=false
      - TLS_VERIFY=false
      - COLLECTION_INTERVAL=60
      - PROMETHEUS_PORT=9080
      - REQUESTS_CA_BUNDLE=/certs/ca.crt
      - GRPC_DEFAULT_SSL_ROOTS_FILE_PATH=/certs/ca.crt
    volumes:
      - ./certs/_master/ca.crt:/certs/ca.crt:ro
    networks:
      - eseries_perf_analyzer
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.collector1.rule=PathPrefix(`/collector1`)"
      - "traefik.http.routers.collector1.entrypoints=metrics"
      - "traefik.http.routers.collector1.tls=true"
      - "traefik.http.routers.collector1.middlewares=collector1-strip"
      - "traefik.http.middlewares.collector1-strip.stripprefix.prefixes=/collector1"
      - "traefik.http.services.collector1.loadbalancer.server.port=9080"

  collector2:
    image: collector:${TAG}
    container_name: collector2
    build: ./epa/
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: 10m
    environment:
      - USERNAME=admin
      - PASSWORD=infiniti  # non-production pass, thank you very much
      - API=192.168.1.195   # <-- second array's controller IP
      - API_PORT=8443
      - DEBUG=false
      - TLS_VERIFY=false
      - COLLECTION_INTERVAL=60
      - PROMETHEUS_PORT=9080
      - REQUESTS_CA_BUNDLE=/certs/ca.crt
      - GRPC_DEFAULT_SSL_ROOTS_FILE_PATH=/certs/ca.crt
    volumes:
      - ./certs/_master/ca.crt:/certs/ca.crt:ro
    networks:
      - eseries_perf_analyzer
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.collector2.rule=PathPrefix(`/collector2`)"
      - "traefik.http.routers.collector2.entrypoints=metrics"
      - "traefik.http.routers.collector2.tls=true"
      - "traefik.http.routers.collector2.middlewares=collector2-strip"
      - "traefik.http.middlewares.collector2-strip.stripprefix.prefixes=/collector2"
      - "traefik.http.services.collector2.loadbalancer.server.port=9080"

  traefik:
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--api.insecure=true" # Enables the Traefik dashboard on 8080 (optional)
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.metrics.address=:9080"
      - "--entrypoints.grafana.address=:3443"
      - "--serverstransport.insecureskipverify=true"
    ports:
      - "${PROMETHEUS_PORT:-9080}:9080"
      - "${GRAFANA_PORT:-3443}:3443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./traefik_dynamic.yml:/etc/traefik/dynamic.yml:ro"
      - "./certs/proxy:/certs/proxy:ro"
      - "./certs/_master/ca.crt:/certs/ca.crt:ro"
    networks:
      - eseries_perf_analyzer

  grafana:
    image: grafana/grafana:13.0-ubuntu
    container_name: grafana
    build:
      context: ./grafana/
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/grafana/certs/grafana.crt
      GF_SERVER_CERT_KEY: /etc/grafana/certs/grafana.key
      GF_SERVER_ROOT_URL: https://localhost:${GRAFANA_PORT:-3443}
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false"
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-metrics-datasource
      GF_DATABASE_SSL_MODE: "enable"
      GF_PLUGIN_ENABLE_ALPHA: "true"
    volumes:
      - ./certs/_master/ca.crt:/usr/local/share/ca-certificates/ca.crt:ro
      - ./certs/grafana:/etc/grafana/certs:ro
      - ./data/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - vm
    networks:
      eseries_perf_analyzer:
        aliases:
          - grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/`)"
      - "traefik.http.routers.grafana.entrypoints=grafana"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.services.grafana.loadbalancer.server.scheme=https"

  grafana-init:
    image: grafana-init:${TAG}
    # image: ghcr.io/scaleoutsean/eseries-perf-analyzer/grafana-init:4.0.0 # example of using GHCR image instead of building locally
    profiles: ["init"]
    build: 
      context: ./grafana-init
    container_name: grafana-init
    mem_limit: 128M
    depends_on:
      - grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GRAFANA_USER=${GRAFANA_ADMIN_USER:-admin}
      - GRAFANA_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GRAFANA_URL=${GRAFANA_URL:-https://grafana:3000}
      - GF_PLUGINS_PREINSTALL_SYNC=victoriametrics-metrics-datasource
      - REQUESTS_CA_BUNDLE=/certs/ca.crt
      - GRPC_DEFAULT_SSL_ROOTS_FILE_PATH=/certs/ca.crt
    volumes:
      - ./certs/_master/ca.crt:/certs/ca.crt:ro
    networks:
      - eseries_perf_analyzer
    restart: "no"

  vm:
    image: victoriametrics/victoria-metrics:latest
    container_name: vm
    # ports:  # Grafana users will just use Grafana and not VM, but if you require access to VM, uncomment this section and enable Traefik routing to VM in the traefik_dynamic.yml file.
    #  - "8428:8428"
    volumes:
      - ./certs/vm:/etc/victoria-metrics:ro
      - ./vm/prometheus-two-array.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/vm:/storage
    command:
      - "-storageDataPath=/storage"
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
      - "-retentionPeriod=3" # 3 months retention
      - '-tls'
      - '-tlsCertFile=/etc/victoria-metrics/vm.crt'
      - '-tlsKeyFile=/etc/victoria-metrics/vm.key'
    networks:
      - eseries_perf_analyzer
    restart: unless-stopped


  # -- WORKLOAD CALIBRATION --
  # A synthetic fio workload generator for validating metrics in Grafana.
  # Run this manually via:  sudo docker compose --profile test up fio-test
  fio-test:
    image: dmonakhov/alpine-fio:latest
    container_name: epa-fio-tester
    profiles: ["test"]
    volumes:
      # Change this path to match your SANtricity mount point!
      - ./data/fio_test_mnt:/mnt/santricity:rw
    # 8k block size, strictly throttled to 10 IOPS
    command: >
      fio --name=test-workload --filename=/mnt/santricity/test.img 
      --size=50M --rw=randrw --bs=4k --ioengine=libaio
      --direct=1 --rate_iops=80,20 --time_based --runtime=3600 --status-interval=600
    networks:
      - eseries_perf_analyzer

networks:
  eseries_perf_analyzer:
    driver: bridge
