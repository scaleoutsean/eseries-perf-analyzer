services:

  collector:
    image: localhost/collector:${TAG}
    # image: ghcr.io/scaleoutsean/eseries-perf-analyzer/collector:4.1.0 # example of using GHCR image instead of building locally
    # Adding a second array? See two-array-docker-compose.yml for a complete working example.
    container_name: collector
    build: ./epa/
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: 10m
    environment: 
      - USERNAME=admin
      - PASSWORD=infiniti  # non-production pass, thank you very much
      - API=192.168.1.194
      - API_PORT=8443
      - DEBUG=false
      - TLS_VERIFY=false
      - COLLECTION_INTERVAL=60
      - PROMETHEUS_PORT=9080
      - REQUESTS_CA_BUNDLE=/certs/ca.crt
      - GRPC_DEFAULT_SSL_ROOTS_FILE_PATH=/certs/ca.crt
    volumes:
      - ./certs/_master/ca.crt:/certs/ca.crt:ro${SELINUX_VOLUME_SUFFIX:-}
    networks:
      - eseries_perf_analyzer
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.collector.rule=PathPrefix(`/collector`)"
      - "traefik.http.routers.collector.entrypoints=metrics"
      - "traefik.http.routers.collector.tls=true"
      - "traefik.http.routers.collector.middlewares=collector-strip"
      - "traefik.http.middlewares.collector-strip.stripprefix.prefixes=/collector"
      - "traefik.http.services.collector.loadbalancer.server.port=9080"


  traefik:
    image: docker.io/library/traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    command:
      - "--log.level=INFO"
      - "--api.insecure=true" # Enables the Traefik dashboard on 8080 (optional)
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.metrics.address=:9080"
      - "--entrypoints.grafana.address=:3443"
      - "--serverstransport.insecureskipverify=true"
    ports:
      - "${PROMETHEUS_PORT:-9080}:9080"
      - "${GRAFANA_PORT:-3443}:3443"
    volumes:
      - "${CONTAINER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro"
      - "./traefik_dynamic.yml:/etc/traefik/dynamic.yml:ro${SELINUX_VOLUME_SUFFIX:-}"
      - "./certs/proxy:/certs/proxy:ro${SELINUX_VOLUME_SUFFIX:-}"
      - "./certs/_master/ca.crt:/certs/ca.crt:ro${SELINUX_VOLUME_SUFFIX:-}"
    networks:
      - eseries_perf_analyzer

  grafana:
    image: docker.io/grafana/grafana:13.2,4-ubuntu
    container_name: grafana
    build:
      context: ./grafana/
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /etc/grafana/certs/grafana.crt
      GF_SERVER_CERT_KEY: /etc/grafana/certs/grafana.key
      GF_SERVER_ROOT_URL: https://localhost:${GRAFANA_PORT:-3443}
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false"
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-metrics-datasource
      GF_DATABASE_SSL_MODE: "enable"
      GF_PLUGIN_ENABLE_ALPHA: "true"
    volumes:
      - ./certs/_master/ca.crt:/usr/local/share/ca-certificates/ca.crt:ro${SELINUX_VOLUME_SUFFIX:-}
      - ./certs/grafana:/etc/grafana/certs:ro${SELINUX_VOLUME_SUFFIX:-}
      - ./data/grafana:/var/lib/grafana:rw${SELINUX_VOLUME_SUFFIX:-}
      - ./grafana/provisioning:/etc/grafana/provisioning:ro${SELINUX_VOLUME_SUFFIX:-}
    depends_on:
      - vm
    networks:
      eseries_perf_analyzer:
        aliases:
          - grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/`)"
      - "traefik.http.routers.grafana.entrypoints=grafana"
      - "traefik.http.routers.grafana.tls=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.services.grafana.loadbalancer.server.scheme=https"

  grafana-init:
    image: localhost/grafana-init:${TAG}
    # image: ghcr.io/scaleoutsean/eseries-perf-analyzer/grafana-init:4.1.0 # example of using GHCR image instead of building locally
    profiles: ["init"]
    build: 
      context: ./grafana-init
    container_name: grafana-init
    mem_limit: 128M
    depends_on:
      - grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GRAFANA_USER=${GRAFANA_ADMIN_USER:-admin}
      - GRAFANA_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GRAFANA_URL=${GRAFANA_URL:-https://grafana:3000}
      - GF_PLUGINS_PREINSTALL_SYNC=victoriametrics-metrics-datasource
      - REQUESTS_CA_BUNDLE=/certs/ca.crt
      - GRPC_DEFAULT_SSL_ROOTS_FILE_PATH=/certs/ca.crt
    volumes:
      - ./certs/_master/ca.crt:/certs/ca.crt:ro${SELINUX_VOLUME_SUFFIX:-}
    networks:
      - eseries_perf_analyzer
    restart: "no"

  vm:
    image: docker.io/victoriametrics/victoria-metrics:latest
    container_name: vm
    # ports:  # Grafana users will just use Grafana and not VM, but if you require access to VM, uncomment this section and enable Traefik routing to VM in the traefik_dynamic.yml file.
    #  - "8428:8428"
    volumes:
      - ./certs/vm:/etc/victoria-metrics:ro${SELINUX_VOLUME_SUFFIX:-}
      - ./vm/prometheus.yml:/etc/prometheus/prometheus.yml:ro${SELINUX_VOLUME_SUFFIX:-}
      - ./data/vm:/storage:rw${SELINUX_VOLUME_SUFFIX:-}
      # - ./vm-backup:/backup:rw${SELINUX_VOLUME_SUFFIX:-} # optional destination for backup to disk
    command:
      - "-storageDataPath=/storage"
      - "-promscrape.config=/etc/prometheus/prometheus.yml"
      - "-retentionPeriod=3" # 3 months retention
      - '-tls'
      - '-tlsCertFile=/etc/victoria-metrics/vm.crt'
      - '-tlsKeyFile=/etc/victoria-metrics/vm.key'
    networks:
      - eseries_perf_analyzer
    restart: unless-stopped


  # -- WORKLOAD CALIBRATION --
  # A synthetic fio workload generator for validating metrics in Prometheus/Grafana.
  # Edit the FIO job (runs automatically) configuration and volumes.
  # Run it manually via: sudo docker compose --profile test up epa-fio-tester
  epa-fio-tester:
    image: localhost/fio
    container_name: epa-fio-tester
    build: 
      context: ./fio    
    profiles: ["test"]
    # volumes:
      # Change the data path to match your mount point. You can customize FIO run
      # with: fio --name ... 
      # - ./data/fio:/data/
      # - ./scripts/job.fio:/etc/fio/job.fio
    # command: fio --name=write --filename=/data/test.img --size=100m ...
    networks:
      - eseries_perf_analyzer

networks:
  eseries_perf_analyzer:
    driver: bridge
